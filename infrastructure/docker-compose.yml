services:
  # Qdrant vector store
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ghost_qdrant
    ports:
      - "6333:6333" # HTTP / REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: WARNING
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FalkorDB graph store
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ghost_falkordb
    ports:
      - "6379:6379" # Redis protocol
      - "3000:3000" # FalkorDB Browser UI
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream message queue
  nats:
    image: nats:2.10-alpine
    container_name: ghost_nats
    command: [ "-js", "-m", "8222" ]
    ports:
      - "4222:4222" # NATS client
      - "8222:8222" # HTTP monitoring
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8222/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
  falkordb_data:
